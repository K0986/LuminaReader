name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository previously had a `gradle-wrapper.properties` but no `gradlew` and
      # no `gradle-wrapper.jar`, so the `./gradlew build` in the README could not run on
      # a fresh clone. The scripts are now committed; this regenerates the JAR if it is
      # ever missing so that CI reports the gap loudly instead of failing obscurely.
      - name: Ensure the Gradle wrapper JAR is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
            echo "::warning file=gradle/wrapper/gradle-wrapper.properties::gradle-wrapper.jar is missing; regenerating for Gradle $version. Commit it with: gradle wrapper --gradle-version $version"
            gradle wrapper --gradle-version "$version"
          fi

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble release (verifies R8 shrinking)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
